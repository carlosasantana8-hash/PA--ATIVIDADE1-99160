<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Inteligente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- LOGO -->
        <div class="logo-area">
            <img src="imagens/Design sem nome.jpg" alt="Logo">
            <h1>Calculadora</h1>
        </div>

        <!-- FORM -->
        <div class="form">
            <input type="number" id="num1" placeholder="Digite o primeiro número">
            <input type="number" id="num2" placeholder="Digite o segundo número">

            <button onclick="calcular()">Calcular</button>
        </div>

        <!-- RESULTADO -->
        <div class="resultado" id="resultado"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
