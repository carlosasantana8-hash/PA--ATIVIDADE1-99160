<!-- Declaração do tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Início do elemento raiz HTML, com atributo lang definindo o idioma como português brasileiro -->
<html lang="pt-br">
<head>
    <!-- Define a codificação de caracteres como UTF-8 para suportar caracteres especiais -->
    <meta charset="UTF-8">
    <!-- Título da página exibido na aba do navegador -->
    <title>Compra de Maçãs</title>
    <!-- Link para o arquivo CSS externo para estilização -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho da página com logo e título -->
    <header>
        <!-- Imagem do logo com atributo src apontando para o caminho da imagem, alt para descrição alternativa e classe CSS -->
        <img src="imagens/Design sem nome.jpg" alt="Logo da Loja" class="logo">
        <!-- Título principal da página -->
        <h1>Loja da Maçã</h1>
    </header>

    <!-- Container principal para organizar o conteúdo -->
    <div class="container">

        <!-- Título secundário da seção -->
        <h2>Calculadora de Compra</h2>

        <!-- Rótulo para o campo de entrada -->
        <label>Quantidade de maçãs:</label>
        <!-- Campo de entrada numérica para a quantidade, com placeholder -->
        <input type="number" id="quantidade" placeholder="Digite a quantidade">

        <!-- Botão que chama a função JavaScript calcular() ao ser clicado -->
        <button onclick="calcular()">Calcular Total</button>

        <!-- Elemento h3 onde o resultado será exibido dinamicamente -->
        <h3 id="resultado"></h3>

    </div>

    <!-- Link para o arquivo JavaScript externo -->
    <script src="script.js"></script>

</body>
</html>
