<!-- Declaração do tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Início do elemento raiz HTML, com atributo lang definindo o idioma como português brasileiro -->
<html lang="pt-br">
<head>
    <!-- Define a codificação de caracteres como UTF-8 para suportar caracteres especiais -->
    <meta charset="UTF-8">
    <!-- Configura a viewport para dispositivos móveis, garantindo responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página exibido na aba do navegador -->
    <title>Calculadora de Média</title>
    <!-- Link para o arquivo CSS externo para estilização -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container principal para organizar o conteúdo -->
    <div class="container">
        <!-- Título principal da página com emoji -->
        <h1>📘 Sistema de Notas</h1>
        <!-- Parágrafo explicativo para o usuário -->
        <p>Digite três notas entre 0 e 10</p>

        <!-- Div para agrupar os campos de entrada -->
        <div class="inputs">
            <!-- Campo de entrada numérica para a primeira nota, com placeholder -->
            <input type="number" id="nota1" placeholder="Nota 1">
            <!-- Campo de entrada numérica para a segunda nota, com placeholder -->
            <input type="number" id="nota2" placeholder="Nota 2">
            <!-- Campo de entrada numérica para a terceira nota, com placeholder -->
            <input type="number" id="nota3" placeholder="Nota 3">
        </div>

        <!-- Botão que chama a função JavaScript calcularMedia() ao ser clicado -->
        <button onclick="calcularMedia()">Calcular Média</button>

        <!-- Div onde o resultado será exibido dinamicamente pelo JavaScript -->
        <div id="resultado"></div>
    </div>

    <!-- Link para o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
